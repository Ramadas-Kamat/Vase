name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys rather than cancelling one midway, so a run never publishes a
# half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Vite 8 requires ^20.19.0 || >=22.12.0.
          node-version: 22
          cache: npm

      - run: npm ci

      # Gates. A commit that fails to typecheck or breaks a test stops here
      # instead of being published.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Optional repository variables (Settings → Secrets and variables →
          # Actions → Variables) that rename the app for this deployment.
          # When unset they arrive blank, and the build falls back to `.env`.
          VITE_APP_NAME: ${{ vars.VITE_APP_NAME }}
          VITE_APP_DESCRIPTION: ${{ vars.VITE_APP_DESCRIPTION }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
