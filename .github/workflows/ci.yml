name: CI

# Checks every branch except main, plus every pull request into main.
# `main` is deliberately excluded: deploy.yml already runs the same gates there
# before publishing, so covering it here would duplicate every run.
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Vite 8 requires ^20.19.0 || >=22.12.0.
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Build here too: a type-clean, test-passing commit can still fail to
      # bundle, and finding that out on dev is cheaper than on main.
      - name: Build
        run: npm run build
